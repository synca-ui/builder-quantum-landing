<!doctype html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Critical CSS inline for immediate rendering -->
  <style>
    /* Critical CSS for immediate rendering - only above-the-fold styles */
    body {
      margin: 0;
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen",
        "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue",
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: #ffffff;
      min-height: 100vh;
    }

    #root {
      min-height: 100vh;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e5e7eb;
      border-top: 4px solid #6366f1;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 50vh auto 0;
      transform: translateY(-20px);
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .header {
      height: 64px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      position: sticky;
      top: 0;
      z-index: 50;
    }
  </style>

  <!-- Preload critical resources -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://clerk.maitr.de" crossorigin />
  <link rel="dns-prefetch" href="https://clerk.maitr.de" />
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" />

      rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet" />
  </noscript>
  <link rel="dns-prefetch" href="//api.netlify.com" />
  <link rel="dns-prefetch" href="//builder-quantum-landing-production.up.railway.app" />
  <link rel="dns-prefetch" href="//clerk.com" />
  <link rel="preconnect" href="https://builder-quantum-landing-production.up.railway.app" crossorigin />
  <link rel="preconnect" href="https://clerk.com" crossorigin />
  <link data-rh="true" rel="canonical" href="https://www.maitr.de/" />

  <!-- SEO Meta Tags -->
  <!--
    Die Beschreibung deckt bewusst BEIDE Produkte ab und wiederholt den Kernsatz
    des Abschnitts "google-profil" – als zusätzliche Absicherung für die
    Google-OAuth-Prüfung, falls ein Prüf-Werkzeug nur die Meta-Tags ausliest.
  -->
  <meta data-rh="true" name="description"
    content="Maitr ist der digitale Gastgeber für Gastronomie: Web-App-Builder für Restaurants in 30 Sekunden – und eine App, die mit ausdrücklicher Zustimmung des Inhabers das Google Unternehmensprofil pflegt, Bewertungen beantwortet und Beiträge veröffentlicht." />
  <meta name="keywords"
    content="web-app builder, restaurant web-app, business web-app, automatisch, konfiguration, web-app erstellen, Web-App, Web-App Builder" />
  <meta name="author" content="Maitr" />
  <meta data-rh="true" name="robots" content="index, follow" />

  <!-- Open Graph Meta Tags -->
  <meta data-rh="true" property="og:title" content="Maitr – Restaurant-Web-App in 30 Sekunden &amp; Google-Profil-Pflege" />
  <meta data-rh="true" property="og:description"
    content="Maitr ist der digitale Gastgeber für Gastronomie: Web-App-Builder für Restaurants in 30 Sekunden – und eine App, die mit ausdrücklicher Zustimmung des Inhabers das Google Unternehmensprofil pflegt, Bewertungen beantwortet und Beiträge veröffentlicht." />
  <meta data-rh="true" property="og:type" content="website" />

  <meta data-rh="true" property="og:locale" content="de_DE" />

  <!-- Twitter Card Meta Tags -->
  <meta data-rh="true" name="twitter:card" content="summary_large_image" />
  <meta data-rh="true" name="twitter:title" content="Maitr – Restaurant-Web-App in 30 Sekunden &amp; Google-Profil-Pflege" />

  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />

  <!-- PWA Manifest -->

  <!--
    Strukturierte Daten (schema.org) als @graph: die Organisation und BEIDE
    Produkte. Der zweite Eintrag beschreibt die Mobile-App, die das Google
    Unternehmensprofil verwaltet – dadurch ist der Zweck der App auch
    maschinenlesbar und nicht nur im Fließtext von #google-profil.
  -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.maitr.de/#organization",
          "name": "Maitr",
          "url": "https://www.maitr.de/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://www.maitr.de/icon-512.png",
            "width": 512,
            "height": 512
          },
          "image": "https://www.maitr.de/og-image.png",
          "description": "Maitr ist der digitale Gastgeber für Gastronomie: ein Web-App-Builder für Restaurants und eine App zur Pflege des Google Unternehmensprofils.",
          "areaServed": "DE",
          "knowsLanguage": "de-DE"
        },
        {
          "@type": "WebSite",
          "@id": "https://www.maitr.de/#website",
          "url": "https://www.maitr.de/",
          "name": "Maitr",
          "inLanguage": "de-DE",
          "publisher": { "@id": "https://www.maitr.de/#organization" }
        },
        {
          "@type": "SoftwareApplication",
          "@id": "https://www.maitr.de/#builder",
          "name": "Maitr Web-App Builder",
          "description": "Erstellt aus einem Google-Maps- oder Website-Link automatisch eine Web-App für Restaurants und Cafés – mit digitaler Speisekarte und Reservierungssystem.",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web",
          "inLanguage": "de-DE",
          "url": "https://www.maitr.de/",
          "offers": {
            "@type": "Offer",
            "price": "39.00",
            "priceCurrency": "EUR",
            "category": "subscription"
          },
          "publisher": { "@id": "https://www.maitr.de/#organization" }
        },
        {
          "@type": "SoftwareApplication",
          "@id": "https://www.maitr.de/#google-profil-app",
          "name": "Maitr – digitaler Gastgeber für Google",
          "description": "Maitr hilft Cafés und Restaurants, ihr Google Unternehmensprofil, Instagram & Co. aktuell zu halten. Mit ausdrücklicher Zustimmung des Inhabers beantwortet Maitr Bewertungen, veröffentlicht Beiträge und pflegt Öffnungszeiten. Jede Aktion wird vor der Veröffentlichung vom Inhaber freigegeben.",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "iOS, Android",
          "inLanguage": "de-DE",
          "url": "https://www.maitr.de/#google-profil",
          "publisher": { "@id": "https://www.maitr.de/#organization" }
        }
      ]
    }
  </script>

  <title>Maitr – Restaurant-Web-App in 30 Sekunden &amp; Google-Profil-Pflege</title>
</head>

<body>
  <!--
    Ohne JavaScript ausgelieferter Inhalt.

    Der Abschnitt "google-profil" ist Grundlage der Google-OAuth-Prüfung für den
    Scope "business.manage": Der Text muss im rohen HTML stehen, also bevor
    JavaScript ausgeführt wurde. Überschrift und Fließtext sind mit Google
    wortgleich mit GOOGLE_SECTION_BODY in
    client/components/sections/GoogleProfileSection.tsx. scripts/prerender.mjs
    bricht den Build ab, sobald die beiden Fassungen auseinanderlaufen.
  -->
  <noscript>
    <section id="google-profil-noscript" aria-labelledby="google-profil-noscript-titel"
      style="max-width: 56rem; margin: 0 auto; padding: 4rem 1.5rem; font-family: system-ui, -apple-system, sans-serif; color: #1f2937;">
      <h1 id="google-profil-noscript-titel"
        style="font-size: 2rem; line-height: 1.2; font-weight: 800; text-align: center; margin: 0 0 1.5rem;">
        Maitr – dein digitaler Gastgeber für Google
      </h1>
      <p style="font-size: 1.125rem; line-height: 1.7; text-align: center; margin: 0 auto; max-width: 48rem;">
        Maitr hilft Cafés und Restaurants, ihr Google Unternehmensprofil, Instagram &amp; Co.
        aktuell zu halten. Mit ausdrücklicher Zustimmung des Inhabers beantwortet Maitr
        Bewertungen, veröffentlicht Beiträge und pflegt Öffnungszeiten. Jede Aktion wird vor
        der Veröffentlichung vom Inhaber freigegeben.
      </p>
      <p style="margin-top: 3rem; text-align: center; color: #4b5563;">
        Maitr ist außerdem ein Web-App-Builder für Restaurants. Für den interaktiven Teil
        dieser Seite wird JavaScript benötigt.
      </p>
    </section>
  </noscript>

  <div id="root">
    <div class="loading-spinner"></div>
  </div>

  <!-- Preload main script for better performance -->
  <script type="module" src="/client/App.tsx"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function () { });
      });
    }
  </script>
</body>

</html>
